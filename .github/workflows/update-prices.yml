name: Update market data

on:
  schedule:
    - cron: '30 6 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/fetch_prices.py
      - run: python scripts/fetch_fund_prices.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/prices.json data/fund-prices.json
          git diff --cached --quiet || git commit -m "Update market data"
          git push
