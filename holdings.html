<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouWealth High Growth — Holdings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #0a0e17;
      --surface: #111827;
      --border: #1e2d40;
      --accent: #00d4aa;
      --text: #e2e8f0;
      --muted: #64748b;
      --up: #00d4aa;
      --down: #ff4757;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'IBM Plex Sans', sans-serif;
      min-height: 100vh;
    }
    header {
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 10;
      gap: 10px;
      flex-wrap: nowrap;
    }
    .back-link {
      color: var(--muted);
      text-decoration: none;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.06em;
      white-space: nowrap;
      flex-shrink: 0;
      transition: color 0.2s;
    }
    .back-link:hover { color: var(--accent); }
    .header-title {
      flex: 1;
      min-width: 0;
      text-align: center;
    }
    .header-title h1 {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.03em;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .header-title .subtitle {
      display: none;
    }
    .status-bar {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      text-align: right;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .status-bar .accent { color: var(--accent); }

    .container {
      max-width: 1440px;
      margin: 0 auto;
      padding: 24px;
    }


    .table-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    .col-header {
      display: grid;
      grid-template-columns: 44px 1fr 76px 180px 86px 200px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 9px;
      color: var(--muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      align-items: center;
    }
    .col-header > * { padding: 0 6px; }
    .col-header > *:first-child { padding-left: 0; text-align: center; }
    .col-header > *:nth-child(3),
    .col-header > *:nth-child(5) { text-align: right; }

    .holding-row {
      display: grid;
      grid-template-columns: 44px 1fr 76px 180px 86px 200px;
      padding: 7px 16px;
      border-bottom: 1px solid rgba(30,45,64,0.45);
      align-items: center;
      transition: background 0.12s;
    }
    .holding-row { cursor: pointer; }
    .holding-row:hover { background: rgba(255,255,255,0.04); }
    .holding-row:last-child { border-bottom: none; }
    .holding-row > * { padding: 0 6px; }

    .rank {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      text-align: center;
      padding-left: 0 !important;
    }
    .name-cell { min-width: 0; }
    .company-name {
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.3;
    }
    .ticker-label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      color: var(--muted);
      margin-top: 1px;
    }
    .weight-pct {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      font-weight: 600;
      color: var(--accent);
      text-align: right;
    }
    .bar-cell { display: flex; align-items: center; gap: 8px; }
    .bar-track {
      flex: 1;
      height: 4px;
      background: rgba(255,255,255,0.06);
      border-radius: 2px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
      opacity: 0.65;
    }
    .ret-cell {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      font-weight: 600;
      text-align: right;
    }
    .ret-cell.up   { color: var(--up); }
    .ret-cell.down { color: var(--down); }
    .ret-cell.pending { color: var(--muted); font-size: 10px; }
    .ret-cell.na { color: var(--muted); }

    .chart-cell { height: 56px; position: relative; }
    .chart-cell canvas { display: block; width: 100% !important; height: 44px !important; }
    .date-label {
      position: absolute;
      bottom: 2px;
      right: 4px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 8px;
      color: var(--muted);
      opacity: 0.65;
      pointer-events: none;
      line-height: 1;
    }

    @media (max-width: 1000px) {
      .col-header, .holding-row {
        grid-template-columns: 40px 1fr 72px 140px 78px 160px;
      }
    }
    @media (max-width: 720px) {
      .container { padding: 16px 12px; }
      .col-header { display: none; }
      .holding-row {
        grid-template-columns: 36px 1fr 68px 68px 130px;
      }
      .bar-cell { display: none; }
      .chart-cell { height: 42px; }
      .chart-cell canvas { height: 42px !important; }
    }
    @media (max-width: 480px) {
      .holding-row {
        grid-template-columns: 30px 1fr 62px 58px 110px;
        padding: 6px 8px;
      }
      .company-name { font-size: 12px; }
    }

    /* Detail modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      width: 100%;
      max-width: 640px;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 16px 20px 0;
    }
    .modal-name {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      text-decoration: none;
      cursor: pointer;
    }
    .modal-name:hover { color: var(--accent); }
    .modal-ticker {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }
    .modal-close {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 20px;
      cursor: pointer;
      padding: 0 0 0 12px;
      line-height: 1;
    }
    .modal-close:hover { color: var(--text); }
    .modal-price-row {
      display: flex;
      gap: 20px;
      padding: 12px 20px 4px;
      font-family: 'IBM Plex Mono', monospace;
      flex-wrap: wrap;
    }
    .modal-stat .label { font-size: 9px; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 3px; }
    .modal-stat .val { font-size: 16px; font-weight: 600; }
    .modal-stat .val.accent { color: var(--accent); }
    .modal-stat .val.up { color: var(--up); }
    .modal-stat .val.down { color: var(--down); }
    .modal-range-btns {
      display: flex;
      gap: 4px;
      padding: 8px 20px;
    }
    .modal-range-btn {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 5px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.15s;
    }
    .modal-range-btn.active { background: var(--accent); border-color: var(--accent); color: var(--bg); }
    .modal-chart-wrap {
      height: 200px;
      padding: 0 12px 12px;
    }
    .modal-chart-wrap canvas { display: block; width: 100% !important; height: 188px !important; }

    .range-bar {
      display: flex;
      gap: 4px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    .list-range-btn {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 5px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.15s;
      letter-spacing: 0.05em;
    }
    .list-range-btn.active { background: var(--accent); border-color: var(--accent); color: var(--bg); }
    .list-range-btn:hover:not(.active) { color: var(--text); border-color: var(--muted); }
    .index-chart-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      height: 160px;
      margin-bottom: 10px;
      padding: 8px 4px 4px;
      position: relative;
    }
    .index-chart-wrap canvas { display: block; width: 100% !important; height: 100% !important; }

    .weighted-return {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      margin-left: auto;
      padding-left: 16px;
      white-space: nowrap;
    }
    .weighted-return .wr-label { color: var(--muted); }
    .weighted-return .wr-val { font-weight: 600; margin-left: 6px; }
    .weighted-return .wr-val.up { color: var(--up); }
    .weighted-return .wr-val.down { color: var(--down); }
      font-family: 'IBM Plex Mono', monospace;
      font-size: 9px;
      color: var(--muted);
      text-align: right;
      padding-top: 2px;
      letter-spacing: 0.02em;
    }
    .chart-cell { height: 56px; }
    .chart-cell canvas { display: block; width: 100% !important; height: 46px !important; }
  </style>
</head>
<body>

<header>
  <a href="index.html" class="back-link">← UNIT PRICES</a>
  <div class="header-title">
    <h1>High Growth Holdings</h1>
    <div class="subtitle">Portfolio as at 30 Sep 2025 · NZ Disclose Register FND46936</div>
  </div>
  <div class="status-bar">
    prices updated <span class="accent" id="updated-date">—</span>
  </div>
</header>

<div class="container">

  <div class="range-bar">
    <button class="list-range-btn" data-days="5">1W</button>
    <button class="list-range-btn" data-days="21">1M</button>
    <button class="list-range-btn" data-days="63">3M</button>
    <button class="list-range-btn" data-days="126">6M</button>
    <button class="list-range-btn active" data-days="252">1Y</button>
    <button class="list-range-btn" data-days="504">2Y</button>
    <div class="weighted-return">
      <span class="wr-label" id="wr-label">Weighted</span>
      <span class="wr-val" id="wr-val">—</span>
    </div>
  </div>
  <div class="index-chart-wrap">
    <canvas id="index-chart"></canvas>
  </div>
  <div class="table-wrap">
    <div class="col-header">
      <span>#</span>
      <span>COMPANY</span>
      <span>WEIGHT</span>
      <span>ALLOCATION</span>
      <span>1YR RETURN</span>
      <span>PRICE — 1 YEAR</span>
    </div>
    <div id="holdings-list"></div>
  </div>

<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal" id="modal">
    <div class="modal-header">
      <div>
        <a class="modal-name" id="modal-name" href="#" target="_blank" rel="noopener"></a>
        <div class="modal-ticker" id="modal-ticker"></div>
      </div>
      <button class="modal-close" onclick="closeModalDirect()">✕</button>
    </div>
    <div class="modal-price-row">
      <div class="modal-stat"><div class="label">Weight</div><div class="val accent" id="modal-weight"></div></div>
      <div class="modal-stat"><div class="label">1Y Return</div><div class="val" id="modal-return"></div></div>
    </div>
    <div class="modal-range-btns">
      <button class="modal-range-btn" data-days="5">1W</button>
      <button class="modal-range-btn" data-days="21">1M</button>
      <button class="modal-range-btn" data-days="63">3M</button>
      <button class="modal-range-btn" data-days="126">6M</button>
      <button class="modal-range-btn active" data-days="252">1Y</button>
      <button class="modal-range-btn" data-days="504">2Y</button>
    </div>
    <div class="modal-chart-wrap">
      <canvas id="modal-canvas"></canvas>
    </div>
  </div>
</div>

</div>

<script>
let HOLDINGS = [];
let N = 0;
let MAX_WEIGHT = 0;
const priceCache = {}; // ticker index -> { dates, closes }
const chartInstances = {};
let activeListDays = 252;
let modalActiveDays = 252;
let modalIdx = -1;
let modalChart = null;
let indexChart = null;

function buildRows() {
  const frag = document.createDocumentFragment();
  HOLDINGS.forEach((h, i) => {
    const row = document.createElement('div');
    row.className = 'holding-row';
    row.onclick = () => openDetail(i);
    const barW = (h.weight / MAX_WEIGHT * 100).toFixed(2);
    row.innerHTML =
      `<div class="rank">${i + 1}</div>` +
      `<div class="name-cell">` +
        `<div class="company-name" title="${h.name}">${h.name}</div>` +
        `<div class="ticker-label">${h.ticker}</div>` +
      `</div>` +
      `<div class="weight-pct">${h.weight.toFixed(2)}%</div>` +
      `<div class="bar-cell"><div class="bar-track"><div class="bar-fill" style="width:${barW}%"></div></div></div>` +
      `<div class="ret-cell na" id="ret${i}">n/a</div>` +
      `<div class="chart-cell" id="cc${i}"><canvas id="cv${i}" height="44"></canvas><div class="date-label" id="dt${i}"></div></div>`;
    frag.appendChild(row);
  });
  document.getElementById('holdings-list').appendChild(frag);
}

document.querySelectorAll('.list-range-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.list-range-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeListDays = parseInt(btn.dataset.days);
    redrawAll();
  });
});

function getSlice(i, days) {
  const c = priceCache[i];
  if (!c) return null;
  return { dates: c.dates.slice(-days), closes: c.closes.slice(-days) };
}

function redrawAll() {
  let wSum = 0, wTotal = 0;
  for (let i = 0; i < N; i++) {
    const s = getSlice(i, activeListDays);
    const retEl = document.getElementById('ret' + i);
    if (!s || s.closes.length < 2) {
      retEl.textContent = 'n/a';
      retEl.className = 'ret-cell na';
      continue;
    }
    const closes = s.closes;
    const ret = (closes[closes.length - 1] - closes[0]) / closes[0] * 100;
    const isUp = ret >= 0;
    retEl.textContent = (isUp ? '+' : '') + ret.toFixed(1) + '%';
    retEl.className = 'ret-cell ' + (isUp ? 'up' : 'down');
    drawSparkline(i, closes, isUp);
    const dtEl = document.getElementById('dt' + i);
    if (dtEl) dtEl.textContent = s.dates[s.dates.length - 1];
    wSum += ret * HOLDINGS[i].weight;
    wTotal += HOLDINGS[i].weight;
  }
  updateWeightedReturn(wSum, wTotal);
}

function updateWeightedReturn(wSum, wTotal) {
  if (wTotal === 0) return;
  const wr = wSum / wTotal;
  const el = document.getElementById('wr-val');
  el.textContent = (wr >= 0 ? '+' : '') + wr.toFixed(2) + '%';
  el.className = 'wr-val ' + (wr >= 0 ? 'up' : 'down');
  buildWeightedChart();
}

function buildWeightedChart() {
  const series = [];
  let minLen = Infinity;
  for (let i = 0; i < N; i++) {
    const s = getSlice(i, activeListDays);
    if (!s || s.closes.length < 2 || s.closes[0] === 0) continue;
    series.push({ norm: s.closes.map(v => v / s.closes[0]), weight: HOLDINGS[i].weight });
    if (s.closes.length < minLen) minLen = s.closes.length;
  }
  if (series.length === 0 || minLen < 2) return;

  const totalW = series.reduce((a, s) => a + s.weight, 0);
  const indexPts = Array.from({ length: minLen }, (_, t) => {
    const val = series.reduce((a, s) => a + s.norm[s.norm.length - minLen + t] * s.weight, 0) / totalW;
    return (val - 1) * 100;
  });

  const rising = indexPts[indexPts.length - 1] >= 0;
  const color = rising ? '#00d4aa' : '#ff4757';
  const labels = Array.from({ length: minLen }, (_, i) => i);

  if (indexChart) {
    indexChart.data.labels = labels;
    indexChart.data.datasets[0].data = indexPts;
    indexChart.data.datasets[0].borderColor = color;
    indexChart.data.datasets[0].backgroundColor = rising ? 'rgba(0,212,170,0.1)' : 'rgba(255,71,87,0.1)';
    indexChart.update('none');
  } else {
    indexChart = new Chart(document.getElementById('index-chart').getContext('2d'), {
      type: 'line',
      data: {
        labels,
        datasets: [{
          data: indexPts,
          borderColor: color,
          backgroundColor: rising ? 'rgba(0,212,170,0.1)' : 'rgba(255,71,87,0.1)',
          borderWidth: 2,
          pointRadius: 0,
          tension: 0.3,
          fill: true,
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            mode: 'index', intersect: false,
            callbacks: {
              label: c => (c.parsed.y >= 0 ? '+' : '') + c.parsed.y.toFixed(2) + '%',
              title: () => ''
            },
            backgroundColor: '#1e2d40', bodyColor: '#e2e8f0', borderColor: '#1e2d40', borderWidth: 1
          }
        },
        scales: {
          x: { display: false },
          y: {
            ticks: { color: '#64748b', font: { family: 'IBM Plex Mono', size: 10 }, maxTicksLimit: 4,
              callback: v => (v >= 0 ? '+' : '') + v.toFixed(1) + '%' },
            grid: { color: '#1e2d40' },
            position: 'right'
          }
        }
      }
    });
  }
}

document.querySelectorAll('.modal-range-btn').forEach(btn => {
  btn.addEventListener('click', e => {
    e.stopPropagation();
    document.querySelectorAll('.modal-range-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    modalActiveDays = parseInt(btn.dataset.days);
    drawModalChart();
  });
});

function openDetail(i) {
  const h = HOLDINGS[i];
  const nameEl = document.getElementById('modal-name');
  nameEl.textContent = h.name;
  nameEl.href = 'https://finance.yahoo.com/quote/' + encodeURIComponent(h.ticker);
  document.getElementById('modal-ticker').textContent = h.ticker + '  ·  ' + h.weight.toFixed(2) + '% of fund';
  document.getElementById('modal-weight').textContent = h.weight.toFixed(2) + '%';
  const retEl = document.getElementById('ret' + i);
  const retVal = document.getElementById('modal-return');
  retVal.textContent = retEl.textContent;
  retVal.className = 'val ' + (retEl.classList.contains('up') ? 'up' : retEl.classList.contains('down') ? 'down' : '');
  const overlay = document.getElementById('modal-overlay');
  overlay.dataset.idx = i;
  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';
  modalIdx = i;
  modalActiveDays = 252;
  document.querySelectorAll('.modal-range-btn').forEach(b => b.classList.toggle('active', b.dataset.days === '252'));
  drawModalChart();
}

function closeModal(e) {
  if (e.target === document.getElementById('modal-overlay')) closeModalDirect();
}
function closeModalDirect() {
  document.getElementById('modal-overlay').classList.remove('open');
  document.body.style.overflow = '';
}

function drawModalChart() {
  const s = getSlice(modalIdx, modalActiveDays);
  if (!s || s.closes.length < 2) {
    if (modalChart) { modalChart.destroy(); modalChart = null; }
    return;
  }
  const slice = s.closes;
  const dateLabels = s.dates;
  const isUp = slice[slice.length - 1] >= slice[0];
  const color = isUp ? '#00d4aa' : '#ff4757';
  const canvas = document.getElementById('modal-canvas');
  if (modalChart) { modalChart.destroy(); modalChart = null; }
  modalChart = new Chart(canvas.getContext('2d'), {
    type: 'line',
    data: {
      labels: dateLabels,
      datasets: [{
        data: slice,
        borderColor: color,
        backgroundColor: isUp ? 'rgba(0,212,170,0.12)' : 'rgba(255,71,87,0.12)',
        borderWidth: 2,
        pointRadius: 0,
        tension: 0.3,
        fill: true,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          mode: 'index', intersect: false,
          callbacks: {
            label: c => ' ' + c.parsed.y.toFixed(2),
            title: tips => [tips[0].label]
          },
          backgroundColor: '#1e2d40', bodyColor: '#e2e8f0', borderColor: '#1e2d40', borderWidth: 1
        }
      },
      scales: {
        x: { display: false },
        y: { ticks: { color: '#64748b', font: { family: 'IBM Plex Mono', size: 10 }, maxTicksLimit: 4 }, grid: { color: '#1e2d40' }, position: 'right' }
      }
    }
  });
}

function drawSparkline(id, pts, isUp) {
  const canvas = document.getElementById('cv' + id);
  if (!canvas) return;
  const color = isUp ? '#00d4aa' : '#ff4757';
  if (chartInstances[id]) chartInstances[id].destroy();
  chartInstances[id] = new Chart(canvas.getContext('2d'), {
    type: 'line',
    data: {
      labels: pts.map((_, k) => k),
      datasets: [{
        data: pts,
        borderColor: color,
        borderWidth: 1.5,
        pointRadius: 0,
        tension: 0.3,
        fill: true,
        backgroundColor: isUp ? 'rgba(0,212,170,0.12)' : 'rgba(255,71,87,0.12)',
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: false,
      plugins: { legend: { display: false }, tooltip: { enabled: false } },
      scales: { x: { display: false }, y: { display: false } },
      layout: { padding: 2 }
    }
  });
}

async function init() {
  let holdingsData, pricesData;
  try {
    [holdingsData, pricesData] = await Promise.all([
      fetch('data/holdings.json').then(r => r.json()),
      fetch('data/prices.json').then(r => r.json()),
    ]);
  } catch (err) {
    document.getElementById('holdings-list').innerHTML =
      '<div style="padding:24px;color:var(--muted);font-family:\'IBM Plex Mono\',monospace;font-size:12px;">Failed to load holdings data.</div>';
    return;
  }

  HOLDINGS = holdingsData;
  N = HOLDINGS.length;
  MAX_WEIGHT = HOLDINGS[0].weight;
  document.getElementById('updated-date').textContent = pricesData.generated_at ? pricesData.generated_at.slice(0, 10) : '—';

  HOLDINGS.forEach((h, i) => {
    const series = pricesData.prices[h.ticker];
    if (series) priceCache[i] = series;
  });

  buildRows();
  redrawAll();
}

init();
</script>
</body>
</html>
